<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-conveyor visualizer</title>
    <script src="/wasm_exec.js"></script>
    <script>
      const go = new Go();
      window.isWasmHandlerReady = new Promise((resolve) => {
        WebAssembly.instantiateStreaming(fetch("%BASE_URL%handler.wasm"), go.importObject).then((result) => {
          go.run(result.instance);
          resolve();
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

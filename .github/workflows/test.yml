name: test

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in go.mod, plus the current release: a library must keep building on both.
        go-version: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      # -cpu=1 is what catches goroutine-accounting bugs the scheduler otherwise hides on a multi-P runtime.
      - run: go test -race -cpu=1,4 ./...
